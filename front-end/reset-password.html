<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" href="style/logo.png" type="image/x-icon">

    <title>Nouveau mot de passe - Talentis</title>
</head>


<body>
    <header class="site-header">
        <div class="container">
            <a class="jobboard" href="main.html"><img src="style/logo.png" class="header-logo" alt=""><span>Talentis</span></a>
            <nav class="navbar" aria-label="Navigation principale">
                <li><a class="btn-nav-outline" href="main.html">Offres</a></li>
                <li data-role="visitor" hidden><a class="btn btn-sm" href="login.html">Se connecter</a></li>
                <li data-role="visitor" hidden><a class="btn-nav-outline" href="account.html">S'inscrire</a></li>
            </nav>
        </div>
    </header>



    <main class="auth">
        <div class="card">

            <!-- indiquer le mail -->
            <form id="forgot-password-form" novalidate>
                <h1>Mot de passe oublié ?</h1>

                <div class="field">
                    <label for="email">Adresse mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-message" required>
                </div>

                <p id="email-message" class="notice" role="status" hidden></p>

                <button class="btn" type="submit">Continuer</button>
            </form>

            <!-- choisir le nouveau mot de passe -->
            <form id="new-password-form" novalidate hidden>
                <h1>Créer un nouveau mot de passe</h1>

                <div class="field">
                    <label for="new-password">Nouveau mot de passe</label>
                    <input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="12" aria-describedby="password-criteria reset-message" required>
                </div>

                <p id="password-criteria" class="notice">12 caractères minimum, avec des lettres et des chiffres.</p>

                <div class="field">
                    <label for="confirm-password">Confirmer le mot de passe</label>
                    <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" aria-describedby="reset-message" required>
                </div>

                <p id="reset-message" class="notice" role="status" hidden></p>

                <button class="btn" type="submit">Réinitialiser le mot de passe</button>
            </form>

            <p class="notice"><a href="login.html">Retour à la connexion</a></p>

        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 Talentis. Tous droits réservés.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/reset-password.js" type="module"></script>
    
</body>
</html>
